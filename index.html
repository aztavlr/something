<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IronLog</title>
  <meta name="description" content="Log workouts, track PRs and progress. Works offline." />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IronLog" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="title">Workout</h1>
    <div id="topbar-action"></div>
  </header>

  <main id="view"></main>

  <div id="rest-timer" class="rest-timer hidden">
    <span>Rest</span>
    <strong id="rest-time">0:00</strong>
    <button data-action="rest-add">+15s</button>
    <button data-action="rest-skip">Skip</button>
  </div>

  <nav class="tabbar">
    <button data-tab="workout" class="active"><span class="ico">🏋️</span>Workout</button>
    <button data-tab="history"><span class="ico">📅</span>History</button>
    <button data-tab="progress"><span class="ico">📈</span>Progress</button>
    <button data-tab="exercises"><span class="ico">📚</span>Exercises</button>
    <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
